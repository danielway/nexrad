name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  # Every facade feature except `parallel`, which does not build for wasm32-unknown-unknown.
  NEXRAD_WASM_FEATURES: model,decode,data,render,process,aws,aws-rustls,serde,uom,chrono

jobs:
  formatting:
    name: Formatting check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          system-deps: "false"
          cache: "false"

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-features --workspace --all-targets -- -D warnings

  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Check feature matrix
        run: cargo hack check --workspace --all-targets --each-feature --optional-deps --release

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins the stable channel, which takes precedence over
      # the default toolchain set by the setup action. RUSTUP_TOOLCHAIN overrides
      # it so that every cargo invocation in this job uses the MSRV toolchain.
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88.0"

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Check workspace
        run: cargo check --workspace --all-features --all-targets

      - name: Check feature matrix
        run: cargo hack check --workspace --each-feature --optional-deps

  documentation:
    name: Documentation check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Check documentation feature matrix
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo hack doc --no-deps --each-feature --optional-deps --release

  examples:
    name: Example compilation check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build all examples
        run: cargo build --workspace --examples --all-features

  fuzz-build:
    name: Fuzz target build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          system-deps: "false"

      - name: Check nexrad-decode fuzz targets
        run: cargo check --manifest-path nexrad-decode/fuzz/Cargo.toml

      - name: Check nexrad-data fuzz targets
        run: cargo check --manifest-path nexrad-data/fuzz/Cargo.toml

  test:
    name: Test (${{ matrix.rust_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust_version: [stable, nightly]
    env:
      # Override rust-toolchain.toml so each matrix entry uses its own toolchain.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.rust_version }}

      - name: Run tests
        run: cargo test --all-features --workspace

  test-feature-sets:
    name: Test facade feature sets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Test without default features
        run: cargo test -p nexrad --no-default-features

      - name: Test the WASM-compatible feature set on native
        run: cargo test -p nexrad --no-default-features --features ${{ env.NEXRAD_WASM_FEATURES }}

      - name: Test nexrad-data without default features
        run: cargo test -p nexrad-data --no-default-features

  windows:
    name: Windows build check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          system-deps: "false"

      # aws-rustls builds aws-lc-sys, which needs NASM on Windows x86 targets.
      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Check workspace
        run: cargo check --workspace --all-features --all-targets

  public-api:
    name: Public API baselines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Listing a public API needs rustdoc JSON from nightly. The toolchain is pinned so the
      # output is reproducible; keep it in sync with NIGHTLY_TOOLCHAIN in
      # xtask/src/public_api.rs.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly-2026-10-11
          system-deps: "false"

      # cargo-public-api 0.52.0 is the latest release as of October 2026 and supports the
      # rustdoc JSON format of the pinned nightly.
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked --version 0.52.0

      - name: Check public API baselines
        run: cargo run -p xtask -- public-api --check

  semver-checks:
    name: Semver checks
    runs-on: ubuntu-latest
    # Every crate is still on the 1.0.0-rc series, whose published releases predate
    # intentional breaking changes. Make this job blocking once 1.0.0 has been released.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          system-deps: "false"

      - name: Check semver against the latest published releases
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          rust-toolchain: manual
          exclude: nexrad-inspector,xtask

  wasm-compatibility:
    name: WASM compatibility check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          system-deps: "false"

      - name: Check nexrad-model (WASM)
        run: cargo check --target wasm32-unknown-unknown -p nexrad-model --all-features

      - name: Check nexrad-decode (WASM)
        run: cargo check --target wasm32-unknown-unknown -p nexrad-decode --all-features

      - name: Check nexrad-process (WASM)
        run: cargo check --target wasm32-unknown-unknown -p nexrad-process --all-features

      - name: Check nexrad-render (WASM)
        run: cargo check --target wasm32-unknown-unknown -p nexrad-render --all-features

      - name: Check nexrad-data without aws (WASM)
        run: cargo check --target wasm32-unknown-unknown -p nexrad-data --no-default-features

      - name: Check nexrad-data with aws (WASM)
        run: cargo check --target wasm32-unknown-unknown -p nexrad-data --no-default-features --features aws

      - name: Check nexrad-data with aws-rustls (WASM)
        run: cargo check --target wasm32-unknown-unknown -p nexrad-data --no-default-features --features aws-rustls

      # Every facade feature except `parallel`, which needs threads.
      - name: Check nexrad facade (WASM)
        run: cargo check --target wasm32-unknown-unknown -p nexrad --no-default-features --features ${{ env.NEXRAD_WASM_FEATURES }}
