[package]
name = "nexrad-data"
version = "1.0.0-rc.7"
description = "Data access for NEXRAD weather radar files and AWS integration."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = [
    ".gitignore",
    "/benches/",
    "/fuzz/",
    "examples/trim_fixture.rs",
    "tests/error_handling.rs",
    "tests/fixture_integration.rs",
    "tests/volume_header.rs",
    "tests/volume_records.rs",
    "tests/volume_scan.rs",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[features]
default = ["aws", "aws-rustls", "model"]
# AWS S3 access, including real-time polling, without a TLS backend. On wasm32 requests go
# through the browser's fetch API and need no TLS feature; native targets need a TLS backend,
# such as `aws-rustls`, to reach the HTTPS endpoints.
aws = ["dep:reqwest", "dep:xml", "dep:futures-util"]
# `aws` with rustls and the aws-lc-rs crypto provider as the TLS backend
aws-rustls = ["aws", "reqwest/rustls"]
# Parallel decompression and decoding using rayon
parallel = ["dep:rayon"]
# Conversion of volume files and real-time chunks into `nexrad-model` types
model = ["dep:nexrad-model", "nexrad-decode/model"]

[dependencies]
log = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
zerocopy = { workspace = true }
bzip2 = { workspace = true }
flate2 = { workspace = true }
nexrad-decode = { version = "1.0.0-rc.3", path = "../nexrad-decode", default-features = false }
reqwest = { workspace = true, optional = true }
xml = { workspace = true, optional = true }
nexrad-model = { version = "1.0.0-rc.2", path = "../nexrad-model", optional = true }
rayon = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
clap = { workspace = true }
env_logger = { workspace = true }
futures-util = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }
criterion = { workspace = true }
http = { workspace = true }

[[example]]
name = "realtime"
path = "examples/realtime.rs"
required-features = ["aws-rustls"]

[[example]]
name = "chunk_iterator"
path = "examples/chunk_iterator.rs"
required-features = ["aws-rustls"]

[[bench]]
name = "scan"
harness = false
required-features = ["model"]
