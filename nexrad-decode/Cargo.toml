[package]
name = "nexrad-decode"
version = "1.0.0-rc.3"
description = "Binary protocol decoding for NEXRAD weather radar data."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = [
    "/benches/",
    "/fuzz/",
    "tests/extract_fixtures.rs",
    "tests/version_compat.rs",
    "tests/volume_decode.rs",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[features]
default = ["model"]
# Conversion of decoded messages into `nexrad-model` types
model = ["dep:nexrad-model"]
# Serialization of the code enums (`WaveformType`, `ChannelConfiguration`, `PulseWidth`,
# `RadialStatus`) and `VcpNumber`, matching their `nexrad-model` counterparts
serde = ["dep:serde", "nexrad-model?/serde"]

[dependencies]
thiserror = { workspace = true }
chrono = { workspace = true }
nexrad-model = { version = "1.0.0-rc.2", path = "../nexrad-model", optional = true }
serde = { workspace = true, optional = true }
zerocopy = { workspace = true }

[dev-dependencies]
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
insta = { workspace = true }
serde_json = { workspace = true }
nexrad-data = { version = "1.0.0-rc.7", path = "../nexrad-data" }
criterion = { workspace = true }

[[example]]
name = "elevation_angles"
path = "examples/elevation_angles.rs"

[[bench]]
name = "decode_messages"
harness = false
