[package]
name = "nexrad-model"
version = "1.0.0"
description = "Core data model for NEXRAD weather radar data."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["science", "data-structures"]
exclude = [
    "/data/",
    "tests/fixture_snapshots.rs",
    "tests/scan_snapshot.rs",
    "tests/snapshots/fixture_snapshots__*",
    "tests/snapshots/scan_snapshot__*",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[features]
serde = ["dep:serde"]
chrono = ["dep:chrono"]

[dependencies]
thiserror = { workspace = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
nexrad-data = { version = "1.0.0-rc.7", path = "../nexrad-data" }
nexrad-decode = { version = "1.0.0", path = "../nexrad-decode" }
