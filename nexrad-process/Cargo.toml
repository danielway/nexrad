[package]
name = "nexrad-process"
version = "1.0.0-rc.1"
description = "Processing algorithms for NEXRAD weather radar data."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[dependencies]
thiserror = { workspace = true }
nexrad-model = { version = "1.0.0", path = "../nexrad-model" }

[dev-dependencies]
nexrad-data = { version = "1.0.0-rc.7", path = "../nexrad-data" }
nexrad-decode = { version = "1.0.0", path = "../nexrad-decode" }
