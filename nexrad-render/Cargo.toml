[package]
name = "nexrad-render"
version = "1.0.0-rc.4"
description = "Rendering functions for NEXRAD weather radar data visualization."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["science", "visualization", "rendering"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[dependencies]
thiserror = { workspace = true }
nexrad-model = { version = "1.0.0-rc.2", path = "../nexrad-model" }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
nexrad-decode = { version = "1.0.0-rc.3", path = "../nexrad-decode" }
nexrad-data = { version = "1.0.0-rc.7", path = "../nexrad-data" }
nexrad-process = { version = "1.0.0-rc.1", path = "../nexrad-process" }
criterion = { workspace = true }

[[bench]]
name = "render_sweep"
harness = false
