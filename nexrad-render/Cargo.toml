[package]
name = "nexrad-render"
version = "1.0.0-rc.4"
description = "Rendering functions for NEXRAD weather radar data visualization."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["science", "visualization", "rendering"]
exclude = [
    "/benches/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[features]
# Adds `RenderResult::into_rgba_image`. Tracks the `image` crate's own 0.x releases and
# is excluded from this crate's semver promise.
image = ["dep:image"]

[dependencies]
thiserror = { workspace = true }
nexrad-model = { version = "1.0.0", path = "../nexrad-model" }
png = "0.18"
image = { version = "0.25", default-features = false, optional = true }

[dev-dependencies]
nexrad-decode = { version = "1.0.0-rc.3", path = "../nexrad-decode" }
nexrad-data = { version = "1.0.0-rc.7", path = "../nexrad-data" }
nexrad-process = { version = "1.0.0-rc.1", path = "../nexrad-process" }
criterion = { workspace = true }

[[bench]]
name = "render_sweep"
harness = false
