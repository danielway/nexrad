[package]
name = "nexrad"
version = "1.0.0-rc.4"
description = "Load, download, decode, process and render NEXRAD weather radar data."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[features]
# Load, download and render
default = ["data", "aws", "aws-rustls", "render"]

# Core crate features
model = ["dep:nexrad-model"]
decode = ["dep:nexrad-decode", "model", "nexrad-decode/model"]
data = ["dep:nexrad-data", "decode", "chrono", "nexrad-data/model"]
render = ["dep:nexrad-render", "model"]
process = ["dep:nexrad-process", "model"]

# Pass-through features from sub-crates
serde = ["nexrad-model?/serde", "nexrad-decode?/serde"]
uom = ["nexrad-model?/uom", "nexrad-decode?/uom"]
chrono = ["nexrad-model?/chrono", "dep:chrono"]
parallel = ["data", "nexrad-data/parallel"]
# AWS S3 access, including real-time streaming, without a TLS backend (see `aws-rustls`)
aws = ["data", "nexrad-data/aws", "dep:futures-util"]
# `aws` with rustls and the aws-lc-rs crypto provider as the TLS backend
aws-rustls = ["aws", "nexrad-data/aws-rustls"]
# `RenderResult::into_rgba_image`; tracks the `image` crate's 0.x releases and is excluded
# from the semver promise, so it is not part of `full`
image = ["render", "nexrad-render/image"]

# Every feature except `image`. `parallel` does not build for wasm32-unknown-unknown.
full = [
    "model",
    "decode",
    "data",
    "render",
    "process",
    "aws",
    "aws-rustls",
    "serde",
    "uom",
    "chrono",
    "parallel",
]

[dependencies]
thiserror = { workspace = true }
chrono = { workspace = true, optional = true }
nexrad-model = { version = "1.0.0-rc.2", path = "../nexrad-model", optional = true, default-features = false }
nexrad-decode = { version = "1.0.0-rc.3", path = "../nexrad-decode", optional = true, default-features = false }
nexrad-data = { version = "1.0.0-rc.7", path = "../nexrad-data", optional = true, default-features = false }
nexrad-render = { version = "1.0.0-rc.4", path = "../nexrad-render", optional = true, default-features = false }
nexrad-process = { version = "1.0.0-rc.1", path = "../nexrad-process", optional = true, default-features = false }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }

[[example]]
name = "decode_summary"
required-features = ["model", "data"]

[[example]]
name = "download_latest"
required-features = ["aws-rustls"]

[[example]]
name = "render_reflectivity"
required-features = ["render", "data"]

[[example]]
name = "processing_pipeline"
required-features = ["render", "data", "process"]

[[example]]
name = "showcase"
required-features = ["render", "data", "process", "chrono"]

[[example]]
name = "timing_analysis"
required-features = ["aws-rustls"]

