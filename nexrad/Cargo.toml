[package]
name = "nexrad"
version = "1.0.0-rc.4"
description = "Load, download, decode, process and render NEXRAD weather radar data."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[features]
default = ["full"]

# Core crate features
model = ["dep:nexrad-model"]
decode = ["dep:nexrad-decode", "model", "nexrad-decode/model"]
data = ["dep:nexrad-data", "decode", "nexrad-data/model"]
render = ["dep:nexrad-render", "model"]
process = ["dep:nexrad-process", "model"]

# Pass-through features from sub-crates
serde = ["nexrad-model?/serde"]
chrono = ["nexrad-model?/chrono", "dep:chrono"]
parallel = ["data", "nexrad-data/parallel"]
# `RenderResult::into_rgba_image`; tracks the `image` crate's 0.x releases and is excluded
# from the semver promise, so it is not part of `wasm` or `full`
image = ["render", "nexrad-render/image"]
# AWS S3 access, including real-time streaming (WASM-compatible)
aws = ["data", "chrono", "nexrad-data/aws", "dep:futures-util"]

# All WASM-compatible features
wasm = ["model", "decode", "data", "render", "process", "aws", "serde", "chrono"]
# Convenience feature for everything (includes native-only `parallel`, not WASM-compatible)
full = ["wasm", "parallel"]

[dependencies]
thiserror = { workspace = true }
chrono = { workspace = true, optional = true }
nexrad-model = { version = "1.0.0-rc.2", path = "../nexrad-model", optional = true, default-features = false }
nexrad-decode = { version = "1.0.0-rc.3", path = "../nexrad-decode", optional = true, default-features = false }
nexrad-data = { version = "1.0.0-rc.7", path = "../nexrad-data", optional = true, default-features = false }
nexrad-render = { version = "1.0.0-rc.4", path = "../nexrad-render", optional = true, default-features = false }
nexrad-process = { version = "1.0.0-rc.1", path = "../nexrad-process", optional = true, default-features = false }
futures-util = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }

[[example]]
name = "decode_summary"
required-features = ["model", "data"]

[[example]]
name = "download_latest"
required-features = ["aws", "model"]

[[example]]
name = "render_reflectivity"
required-features = ["render", "data"]

[[example]]
name = "processing_pipeline"
required-features = ["render", "data", "process"]

[[example]]
name = "showcase"
required-features = ["render", "data", "process", "chrono"]

[[example]]
name = "timing_analysis"
required-features = ["aws", "model", "chrono"]

